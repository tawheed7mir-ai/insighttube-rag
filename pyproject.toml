[project]
name = "youtube-podcast-rag"
version = "0.1.0"
description = "Production-oriented YouTube and podcast RAG platform"
requires-python = ">=3.10"
dependencies = [
    "youtube-transcript-api>=1.0.0",
    "pydantic>=2.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "streamlit>=1.32",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
